<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Dünya 3D Topografik Hologram Haritası - İnteraktif küresel keşif deneyimi">
    <title>Dünya 3D Topografik Hologram</title>

    <script src='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js'></script>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css' rel='stylesheet' />
    <link
        href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Oxanium:wght@500;600;700&family=Rajdhani:wght@300;400;500;600;700&family=Share+Tech+Mono&display=swap"
        rel="stylesheet">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Loading Screen -->
    <div class="loading-screen" id="loading-screen">
        <div class="loading-content">
            <div class="loading-text loading-brand">GeoFlight</div>
            <div class="loading-hex"></div>
            <div class="loading-bar-container">
                <div class="loading-bar" id="loading-bar"></div>
            </div>
            <div class="loading-start">Başlamak için tıklayın</div>
            <div class="loading-authors">
                <div>Hazal Karayiğit</div>
                <div>Alper Tunga Amirahmadov</div>
                <div>Ali Berk Bacaksız</div>
            </div>
        </div>
    </div>

    <!-- Map -->
    <div id='map'></div>

    <!-- Scanlines Overlay -->
    <div class="scanlines"></div>

    <!-- Particles -->
    <div class="particles-container" id="particles"></div>

    <!-- Corner Brackets -->
    <div class="corner-bracket corner-tl"></div>
    <div class="corner-bracket corner-tr"></div>
    <div class="corner-bracket corner-bl"></div>
    <div class="corner-bracket corner-br"></div>

    <!-- Top HUD -->
    <div class="hud-top">
        <div class="hud-logo">
            <div class="hud-logo-icon"></div>
            <span class="hud-logo-text">GeoFlight</span>
        </div>
        <div class="hud-status">
            <div class="hud-status-item" id="hud-time">--:--:--</div>
        </div>
    </div>

    <!-- Bottom HUD -->
    <div class="hud-bottom">
        <div class="hud-coords" id="hud-coords">LAT 0.0000 · LNG 0.0000</div>
    </div>

    <!-- Compass -->
    <div class="compass" role="img" aria-label="Pusula">
        <span class="compass-cardinal compass-north">N</span>
        <span class="compass-cardinal compass-east">E</span>
        <span class="compass-cardinal compass-south">S</span>
        <span class="compass-cardinal compass-west">W</span>
        <div class="compass-needle" id="compass-needle"></div>
        <div class="compass-pivot"></div>
    </div>

    <!-- Hover Tooltip -->
    <div class="hover-tooltip" id="hover-tooltip"></div>

    <!-- Hologram Info Card -->
    <div id="hologram-card" class="hologram-card">
        <div class="card-glow-line"></div>
        <button class="card-close" id="card-close" title="Kapat">✕</button>
        <div class="card-header">
            <div class="card-tag">Küresel İstihbarat Ağı</div>
            <h2 class="card-title" id="country-name">--</h2>
            <div class="card-subtitle" id="card-subtitle">// BÖLGE VERİSİ YÜKLENİYOR...</div>
        </div>
        <div class="card-body">
            <div class="card-terminal" id="country-info">
                <div id="country-info-template"></div>
            </div>
        </div>
        <div class="card-footer">
            <div class="stat-box">
                <div class="stat-label">Sinyal</div>
                <div class="stat-value" id="stat-signal">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Tehdit</div>
                <div class="stat-value" id="stat-threat">--</div>
            </div>
            <div class="stat-box">
                <div class="stat-label">Durum</div>
                <div class="stat-value" id="stat-status">--</div>
            </div>
        </div>
    </div>

    <script src="app.js"></script>
</body>

</html>
